<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7f5f1">
<title>Stambo.i — Editorial Studio</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f6f4ef;--ink:#171716;--muted:#837f79;--border:#e2ddd5;--card:#fffefa;--accent:#ab9179}
*{box-sizing:border-box}html,body{padding:0;margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
button{font-family:inherit;cursor:pointer}button:disabled{opacity:.35;cursor:default}img{display:block} .shell{max-width:680px;margin:auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 98px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 1px 15px;border-bottom:1px solid var(--border)}.wordmark{font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:400;letter-spacing:-2px}.eyebrow{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:650}.avatar{width:36px;height:36px;border-radius:50%;background:#211f1e;color:white;display:grid;place-items:center;font-family:Georgia,serif;font-size:21px}
.hero{padding:26px 2px 20px}.hero h1{font-family:Georgia,serif;font-weight:400;font-size:32px;line-height:1.02;letter-spacing:-1.4px;margin:10px 0}.hero p{color:var(--muted);font-size:13px;line-height:1.5;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:22px}.stat{background:var(--card);border:1px solid var(--border);padding:15px 8px 12px;border-radius:4px;text-align:center}.stat strong{font-family:Georgia,serif;font-weight:400;font-size:28px;display:block}.stat span{font-size:10px;color:var(--muted)}
.section{display:flex;align-items:center;justify-content:space-between;margin:26px 0 11px}.section h2{font-family:Georgia,serif;font-weight:400;font-size:25px;margin:0}.section small{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}.tab{white-space:nowrap;border:1px solid var(--border);background:transparent;padding:9px 13px;border-radius:20px;font-size:11px}.tab.active{background:var(--ink);color:white;border-color:var(--ink)}
.list{display:grid;gap:13px}.draft{border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--card);text-align:left;padding:0;width:100%}.cover{aspect-ratio:1.25;background:#e4dfd6;display:grid;place-items:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.placeholder{font:italic 27px Georgia,serif;color:#958b7d}.draft-body{padding:17px 16px}.labelrow{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#8c7664}.date{font-size:10px;color:var(--muted)}.draft h3{font:normal 23px/1.12 Georgia,serif;margin:11px 0}.preview{font-size:12px;line-height:1.55;color:#66605a;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.openline{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-top:19px;padding-top:12px;border-top:1px solid var(--border)}
.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:rgba(250,248,244,.97);border-top:1px solid var(--border);padding:11px max(18px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:space-around}.nav button{border:0;background:none;display:grid;justify-items:center;gap:5px;color:var(--muted);font-size:10px;padding:2px 10px}.nav button.active{color:var(--ink);font-weight:700}.nav svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.7;fill:none}
.detail{display:none;position:fixed;inset:0;z-index:9;overflow:auto;background:var(--bg);padding-bottom:calc(env(safe-area-inset-bottom) + 95px)}.detail.visible{display:block}.detail-top{position:sticky;top:0;z-index:2;background:rgba(247,245,241,.97);display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 13px) 18px 13px;border-bottom:1px solid var(--border)}.back{border:0;background:transparent;font-size:12px;letter-spacing:.5px}.detail-scroller{max-width:680px;margin:auto}.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:4px}.slide{flex:0 0 100%;aspect-ratio:4/5;scroll-snap-align:center;background:#e9e5dd;display:grid;place-items:center}.slide img{width:100%;height:100%;object-fit:contain}.detail-contents{padding:22px 20px}.detail-title{font:normal 31px/1.13 Georgia,serif;margin:10px 0 18px}.post-text{font-size:14px;line-height:1.8;white-space:pre-line;overflow-wrap:anywhere}.post-text a{color:#80664f;text-decoration:underline}.detail-actions{position:fixed;bottom:0;left:0;right:0;z-index:12;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);background:rgba(247,245,241,.98);border-top:1px solid var(--border);display:flex;gap:9px;justify-content:center}.detail-actions button{min-height:46px;border:1px solid var(--ink);padding:12px 14px;background:var(--ink);color:white;border-radius:4px;font-size:12px}.detail-actions .secondary{background:transparent;color:var(--ink)}.message{margin:24px 0;padding:22px;background:var(--card);border:1px solid var(--border);font-size:13px;line-height:1.6;color:#696158}.loader{padding:40px;text-align:center;color:var(--muted);font-size:13px}.hidden{display:none!important}.empty{padding:30px 12px;text-align:center;color:var(--muted);font:italic 18px Georgia,serif}
</style></head><body>
<div class="shell"><header class="top"><div><div class="wordmark">Stambo.i</div><div class="eyebrow">Fashion editorial studio</div></div><div class="avatar">S</div></header>
<section class="hero"><span class="eyebrow">Редакторская панель / 2026</span><h1>Мода начинается<br>с деталей.</h1><p>Черновики, подборки и новости — все материалы перед публикацией.</p></section>
<section class="stats"><div class="stat"><strong id="pending">—</strong><span>На проверке</span></div><div class="stat"><strong id="published">—</strong><span>Опубликовано</span></div><div class="stat"><strong id="rejected">—</strong><span>Отклонено</span></div></section>
<section class="section"><h2 id="sectionTitle">Черновики</h2><small id="count"></small></section>
<div class="tabs" id="filters"><button class="tab active" data-filter="all">Все</button><button class="tab" data-filter="picks">Подборки</button><button class="tab" data-filter="looks">Образы</button><button class="tab" data-filter="news">Новости</button><button class="tab" data-filter="history">История</button></div>
<main class="list" id="list"><div class="loader">Загружаю черновики…</div></main></div>
<nav class="nav"><button class="active" id="navPending"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Черновики</button><button id="navPublished"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>История</button><button id="navRefresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2-5M20 4v5h-5"/></svg>Обновить</button></nav>
<div class="detail" id="detail"><div class="detail-top"><button class="back" id="back">← Все материалы</button><span class="eyebrow">Stambo.i / Просмотр</span></div><div class="detail-scroller"><div class="gallery" id="gallery"></div><div class="detail-contents"><span class="eyebrow" id="detailType"></span><h1 class="detail-title" id="detailTitle"></h1><div class="post-text" id="postText"></div></div></div><div class="detail-actions" id="actions"></div></div>
<script>
(()=>{'use strict';
const tg=window.Telegram?.WebApp;const BASE='https://raw.githubusercontent.com/Grach31/irina-mods/main/';const API='https://api.github.com/repos/Grach31/irina-mods/contents/drafts';
const $=id=>document.getElementById(id);let state={},items=[],active=null,filter='all',mode='pending';
const viewerId=Number(tg?.initDataUnsafe?.user?.id||0);const readonly=viewerId===731539637;
if(tg){tg.ready();tg.expand();try{tg.requestFullscreen?.()}catch(e){}}
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
const category=t=>({picks:'Подборка',looks:'Готовые образы',news:'Новости моды',history:'История моды',album:'Фотоальбом',item:'Образ'})[t]||'Материал';
const imageFor=d=>{let p=d.id;return BASE+'drafts/img/'+encodeURIComponent(p)+'.jpg'};
async function readJson(url){let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function load(){ $('list').innerHTML='<div class="loader">Загружаю материалы…</div>';try{
state=await readJson(BASE+'state/state.json');let all=Object.entries(state.drafts||{});
const allowed=all.filter(([id,s])=>['sent','awaiting_edit','published','rejected'].includes(s.status)).sort((a,b)=>(b[1].sent_at||'').localeCompare(a[1].sent_at||'')).slice(0,120);
$('pending').textContent=all.filter(([id,s])=>s.status==='sent').length;$('published').textContent=all.filter(([id,s])=>s.status==='published').length;$('rejected').textContent=all.filter(([id,s])=>s.status==='rejected').length;
items=await Promise.all(allowed.map(async([id,s])=>{try{let d=await readJson(BASE+'drafts/'+encodeURIComponent(id)+'.json');return {...d,meta:s}}catch(e){return null}}));items=items.filter(Boolean);render()
}catch(e){$('list').innerHTML='<div class="message">Не удалось загрузить материалы. Проверь подключение и обнови экран.<br><small>'+escapeHtml(e.message)+'</small></div>'}}
function current(){return items.filter(d=>(mode==='pending'?['sent','awaiting_edit'].includes(d.meta.status):['published','rejected'].includes(d.meta.status))&&(filter==='all'||d.type===filter))}
function render(){let list=current();$('count').textContent=list.length+' материалов';$('sectionTitle').textContent=mode==='pending'?'Черновики':'История';
$('navPending').classList.toggle('active',mode==='pending');$('navPublished').classList.toggle('active',mode==='history');
$('list').innerHTML=list.length?'':'<div class="empty">Материалов в этой категории пока нет</div>';
list.forEach(d=>{const card=document.createElement('button');card.className='draft';const title=strip(d.text).slice(0,100)||d.id;card.innerHTML='<div class="cover"><img loading="lazy" alt="Фото публикации" src="'+imageFor(d)+'"></div><div class="draft-body"><div class="labelrow"><span class="pill">'+escapeHtml(category(d.type))+'</span><span class="date">'+escapeHtml((d.meta.sent_at||'').slice(0,10))+'</span></div><h3>'+escapeHtml(title.slice(0,77))+'</h3><p class="preview">'+escapeHtml(title.slice(77)||'Посмотреть фотографии, описание и ссылки на вещи')+'</p><div class="openline"><span>Смотреть публикацию</span><span>→</span></div></div>';card.querySelector('img').onerror=e=>{e.target.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',textContent:'Stambo.i'}))};card.onclick=()=>open(d);$('list').append(card)})}
function gallerySources(d){let a=[];const root=BASE+'drafts/img/';if(d.type==='looks'){const count=Math.min(10,1+(d.looks?.length||0));for(let i=1;i<=count;i++)a.push(root+encodeURIComponent(d.id)+(i===1?'':'-'+i)+'.jpg')}else if(d.type==='album'&&d.photos?.length){a=d.photos.filter(p=>typeof p==='string').slice(0,10).map(p=>p.startsWith('http')?p:BASE+p)}else if(d.type==='item'&&d.image){a=[d.image.startsWith('http')?d.image:BASE+d.image]}else if(d.type==='picks'&&d.items?.length){a=d.items.slice(0,10).map(i=>i.img).filter(Boolean)}else if(d.card?.images?.length){a=[imageFor(d)];}else{a=[imageFor(d)]}return a.length?a:[imageFor(d)]}
function open(d){active=d;$('detail').classList.add('visible');$('detail').scrollTop=0;$('detailType').textContent=category(d.type);$('detailTitle').textContent=strip(d.text).slice(0,92)||d.id;
$('gallery').replaceChildren();gallerySources(d).forEach(url=>{const box=document.createElement('div');box.className='slide';const im=document.createElement('img');im.src=url;im.alt='Фото черновика';im.onerror=()=>{box.textContent='Фото недоступно'};box.append(im);$('gallery').append(box)});
const target=$('postText');target.innerHTML=String(d.text||'').replace(/<(?!\/?(?:b|i|a)(?:\s|>|\/))[^>]*>/gi,'');target.querySelectorAll('a').forEach(a=>{if(!/^https:\/\//.test(a.href))a.removeAttribute('href');else{a.target='_blank';a.rel='noopener noreferrer'}});
const actions=$('actions');actions.replaceChildren();if(d.meta.status==='sent'&&!readonly){[['Правки','edit','secondary'],['Отклонить','no','secondary'],['Опубликовать','ok','']].forEach(([name,action,css])=>{const btn=document.createElement('button');btn.className=css;btn.textContent=name;btn.onclick=()=>act(action,d);actions.append(btn)})}else{const p=document.createElement('span');p.className='eyebrow';p.textContent=readonly?'Только просмотр':d.meta.status==='published'?'Опубликовано':'Материал обработан';actions.append(p)}}
function act(action,d){if(!tg?.sendData){alert('Открой приложение кнопкой в Telegram-боте');return}let msg=action==='ok'?'Опубликовать этот пост в канал?':action==='no'?'Отклонить этот черновик?':'Запросить правки?';if(!confirm(msg))return;tg.sendData(JSON.stringify({type:'stambo_miniapp',action,id:d.id}));tg.close()}
$('back').onclick=()=>{$('detail').classList.remove('visible');active=null};
$('navPending').onclick=()=>{mode='pending';render()};$('navPublished').onclick=()=>{mode='history';render()};$('navRefresh').onclick=load;
$('filters').onclick=e=>{const btn=e.target.closest('[data-filter]');if(!btn)return;filter=btn.dataset.filter;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===btn));render()};
if(!tg?.initDataUnsafe?.user){$('list').innerHTML='<div class="message">Открой Stambo.i из кнопки в Telegram-боте Moda. В обычном браузере доступ отключён.</div>'}else load();
})();
</script></body></html>
