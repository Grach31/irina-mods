name: Telegram widget checks
on:
  pull_request:
    paths:
      - 'bot/widget.py'
      - 'bot/main.py'
      - 'tests/test_widget.py'
      - '.github/workflows/widget-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q bot
      - run: python -m unittest discover -s tests -p test_widget.py -v
