name: Diagnose Zara and HM catalogs (no production changes)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-zara-hm.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q beautifulsoup4 lxml
      - name: Probe official catalogs and product metadata
        run: |
          python - <<'PY'
          import re,urllib.request,urllib.error,json
          from bs4 import BeautifulSoup
          sites={
            'ZARA_ES':'https://www.zara.com/es/es/mujer-novedades-l1180.html',
            'ZARA_US':'https://www.zara.com/us/en/woman-new-in-l1180.html',
            'HM_GB':'https://www2.hm.com/en_gb/ladies/new-arrivals/clothes.html',
            'HM_US':'https://www2.hm.com/en_us/women/new-arrivals/clothes.html',
          }
          for brand,url in sites.items():
            print('\nBRAND',brand,'URL',url,flush=True)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36','Accept-Language':'en-US,en;q=0.9'})
              with urllib.request.urlopen(req,timeout=22) as r:
                raw=r.read(1500000); final=r.geturl(); status=r.status
              soup=BeautifulSoup(raw,'lxml')
              title=soup.title.get_text(' ',strip=True)[:120] if soup.title else ''
              links=[a.get('href','') for a in soup.find_all('a',href=True)]
              product_links=list(dict.fromkeys(x for x in links if re.search(r'(-p\d+\.html|/\d{8,}(?:\.html)?|/product/)',x)))
              images=[x.get('src') or x.get('data-src') for x in soup.find_all('img') if x.get('src') or x.get('data-src')]
              prices=re.findall(r'(?:€|£|\$)\s?\d{1,4}(?:[.,]\d{2})?|\d{1,4}(?:[.,]\d{2})?\s?(?:€|£|\$)',soup.get_text(' ',strip=True))[:10]
              print('RESULT',json.dumps({'status':status,'final_url':final,'bytes':len(raw),'title':title,'product_links':len(product_links),'sample_links':product_links[:4],'images':len(images),'sample_images':images[:2],'price_samples':prices,'captcha_signals':bool(re.search(r'captcha|access denied|blocked|robot check',title,re.I))},ensure_ascii=False),flush=True)
            except Exception as e:
              print('ERROR',type(e).__name__,str(e)[:180],flush=True)
          PY
