name: Новинки магазинов
on:
  schedule:
    - cron: "0 4 * * *"   # 07:00 МСК
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scrape
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt && .github/fonts.sh
      - run: python bot/scrape.py
        env:
          DATA_DIR: "."
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/sheets
          git diff --cached --quiet || (git commit -m "Новинки магазинов" && git pull --rebase -X theirs && git push)
