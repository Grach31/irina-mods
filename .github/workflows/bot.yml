name: Бот канала
on:
  schedule:
    - cron: "*/20 5-18 * * *"   # каждые 20 минут с 8:00 до 21:40 МСК
  push:
    paths: ["drafts/**"]       # новый черновик — сразу отправить Ирине
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt && .github/fonts.sh
      - run: python bot/poll.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state data/requests.json data/requests 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Бот: состояние" && git pull --rebase -X theirs && git push)
