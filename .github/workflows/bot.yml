name: Бот канала
on:
  schedule:
    - cron: "*/15 * * * *"   # короткие циклы доставки и обработки решений
  workflow_dispatch:
    inputs:
      minutes:
        description: "Сколько минут работать"
        default: "12"
permissions:
  contents: write
  id-token: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    if: ${{ !github.event.repository.private }}   # долгий запуск только в открытом репозитории
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt && .github/fonts.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: python -u bot/main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DATA_DIR: "."
          LOOP_MINUTES: ${{ inputs.minutes || '12' }}
