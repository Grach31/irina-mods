name: Бот канала
on:
  schedule:
    - cron: "*/30 * * * *"   # если бот не запущен — запустить; каждый запуск работает ~5,5 часа
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    if: ${{ !github.event.repository.private }}   # долгий запуск только в открытом репозитории
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt && .github/fonts.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: python bot/main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DATA_DIR: "."
          LOOP_MINUTES: "330"
