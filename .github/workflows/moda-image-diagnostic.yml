name: Moda image connectivity diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/moda-image-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check official product pages and their image URLs
        run: |
          python - <<'PY'
          import html, re, urllib.request, urllib.parse, io, json
          from html.parser import HTMLParser
          class Images(HTMLParser):
              def __init__(self):
                  super().__init__(); self.urls=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='meta' and a.get('property') in ('og:image','og:image:secure_url') and a.get('content'):
                      self.urls.append(a['content'])
                  if tag=='img':
                      for k in ('src','data-src'):
                          if a.get(k): self.urls.append(a[k])
          pages=[
              'https://allweneed.ru/product/palto-halat-korichnevyj-276796',
              'https://emkashop.ru/yubka-s1124-peter',
              'https://allweneed.ru/product/sviter-iz-shersti-enota-premium-molochnyj-195386',
              'https://emkashop.ru/bryuki-d555-tricel',
          ]
          results=[]
          for url in pages:
              record={'product_url':url,'page_ok':False,'image_ok':False}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; ModaEditorial/1.0)'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      body=response.read(3000000).decode('utf-8','replace')
                      record['page_http']=response.status
                  record['page_ok']=True
                  p=Images();p.feed(body)
                  candidates=list(dict.fromkeys(urllib.parse.urljoin(url,html.unescape(s)) for s in p.urls if s))
                  record['image_candidates']=len(candidates)
                  for image_url in candidates[:12]:
                      try:
                          req=urllib.request.Request(image_url,headers={'User-Agent':'Mozilla/5.0','Referer':url})
                          with urllib.request.urlopen(req,timeout=15) as resp:
                              data=resp.read(3000000);mime=resp.headers.get('Content-Type','')
                          if not mime.lower().startswith('image/') or len(data)<3000:continue
                          try:
                              from PIL import Image
                              im=Image.open(io.BytesIO(data));im.verify()
                              dimensions=list(im.size)
                          except ImportError:
                              signatures=(data.startswith(b'\xff\xd8\xff'),data.startswith(b'\x89PNG\r\n\x1a\n'),data.startswith(b'RIFF') and data[8:12]==b'WEBP')
                              if not any(signatures):continue
                              dimensions=None
                          record.update(image_ok=True,image_url=image_url,image_bytes=len(data),image_type=mime,image_dimensions=dimensions)
                          break
                      except Exception as exc:record['last_image_error']=str(exc)[:160]
              except Exception as exc:record['page_error']=str(exc)[:240]
              results.append(record)
              print('MODA_IMAGE_PROBE '+json.dumps(record,ensure_ascii=False))
          with open('moda-image-diagnostic.json','w') as f:json.dump(results,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: moda-image-diagnostic
          path: moda-image-diagnostic.json
