name: Test new fashion brands (diagnostic only)
on:
  push:
    paths:
      - '.github/workflows/test-fashion-brands.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public catalogs and product metadata
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, re, html
          sites = {
              'STUDIO 29': 'https://studio-29.ru/catalog',
              'GATE31': 'https://www.gate31.ru/collection/woman',
              'Present & Simple': 'https://presentandsimple.com/',
              'ALL WE NEED': 'https://allweneed.ru/catalog',
              'CHARUEL': 'https://www.charuel.ru/',
          }
          for brand, url in sites.items():
              print('\nBRAND:', brand, 'URL:', url, flush=True)
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36','Accept-Language':'ru-RU,ru;q=0.9'})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body = r.read(2500000).decode('utf-8', 'replace')
                      print('HTTP:', r.status, 'Final:', r.url, 'Chars:', len(body))
                  print('Anti-bot markers:', [x for x in ('servicepipe','captcha','cloudflare','access denied') if x in body.lower()])
                  print('Price markers:', len(re.findall(r'(?:₽|&#8381;|руб\.?|RUB)',body,re.I)))
                  print('Images:', len(re.findall(r'<(?:img|source)\b',body,re.I)))
                  print('Links:', len(re.findall(r'<a\b[^>]*href=',body,re.I)))
                  print('Product schema:', 'schema.org/Product' in body or '"@type":"Product"' in body)
                  title = re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)
                  print('Title:', html.unescape(re.sub(r'\s+',' ',title.group(1)))[:120] if title else 'not found')
                  print('VERDICT:', 'REQUIRES PARSER TEST' if len(re.findall(r'(?:₽|&#8381;|руб\.?|RUB)',body,re.I))>2 and len(re.findall(r'<(?:img|source)\b',body,re.I))>2 else 'NO USABLE HTML CONFIRMED')
              except Exception as e:
                  print('ERROR:',type(e).__name__,str(e)[:180])
          PY
      - name: Inspect embedded product data for two candidates
        run: |
          python - <<'PY'
          import urllib.request, re, json, html, urllib.parse
          targets = {
            'STUDIO 29': ['https://studio-29.ru/catalog/verhnyaya-odejda-sp','https://www.studio-29.ru/'],
            'ALL WE NEED': ['https://allweneed.ru/catalog'],
          }
          for brand, urls in targets.items():
            for url in urls:
              print('\nBRAND:', brand, 'URL:', url, flush=True)
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Chrome/130 Safari/537.36','Accept-Language':'ru-RU,ru;q=0.9'})
                with urllib.request.urlopen(req,timeout=25) as r: body=r.read(3000000).decode('utf-8','replace')
                print('HTTP:',r.status,'Bytes:',len(body),'Final:',r.url)
                for tag in ('script','a','img','source'):
                  print('TAG',tag,'count:',len(re.findall(r'<'+tag+r'\b',body,re.I)))
                for marker in ('__NEXT_DATA__','__NUXT_DATA__','__INITIAL_STATE__','application/ld+json','/bitrix/','data-product','product-card','productCard','offers'):
                  print('MARKER',marker,body.lower().count(marker.lower()))
                scripts=re.findall(r'<script\b[^>]*>(.*?)</script>',body,re.I|re.S)
                print('INLINE SCRIPTS:',len(scripts),'JSON-LIKE:',sum(1 for t in scripts if any(x in t for x in ('price','product','offers'))))
                print('IMAGE URL OCCURRENCES:',len(re.findall(r'https?[^"\s<>]{5,200}\.(?:webp|jpg|png)',body,re.I)))
                print('RUBLE MARKERS:',len(re.findall(r'₽|руб\.?|RUB',body,re.I)))
                print('PRODUCT PATHS:',len(set(re.findall(r'/(?:catalog|product)/[a-zA-Z0-9_/-]{8,100}',body))))
                print('SAMPLE PRODUCT PATHS:',list(dict.fromkeys(re.findall(r'/(?:catalog|product)/[a-zA-Z0-9_/-]{8,100}',body)))[:3])
              except Exception as e: print('ERROR:',type(e).__name__,str(e)[:160])
          PY

      - name: Extract candidate product cards and verify images
        run: |
          python -m pip install -q beautifulsoup4 lxml
          python - <<'PY'
          import urllib.request,urllib.parse,re,json
          from bs4 import BeautifulSoup
          sites={'STUDIO 29':'https://studio-29.ru/catalog/verhnyaya-odejda-sp','ALL WE NEED':'https://allweneed.ru/catalog'}
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36','Accept-Language':'ru-RU,ru;q=0.9'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as r:return r.read(3000000)
          for brand,url in sites.items():
              print('\\nBRAND',brand,flush=True)
              try:
                  soup=BeautifulSoup(get(url),'lxml')
                  found={}
                  for a in soup.select('a[href]'):
                      href=a.get('href','')
                      if brand=='ALL WE NEED':
                          if '/product/' not in href:continue
                      else:
                          if not (a.find_parent(class_=re.compile('productCard|product-card',re.I)) or re.search(r'/product/|/item/|/catalog/[^/]+/[^/]+',href)):continue
                      target=urllib.parse.urljoin(url,href)
                      if target in found:continue
                      card=a
                      for i in range(6):
                          if card is None:break
                          text=card.get_text(' ',strip=True)
                          img=card.find('img')
                          if img and re.search(r'\\d[\\d\\s]{2,9}\\s*(?:₽|руб)',text,re.I):break
                          card=card.parent
                      if card is None:continue
                      text=card.get_text(' ',strip=True)
                      price=re.search(r'\\d[\\d\\s]{2,9}\\s*(?:₽|руб)',text,re.I)
                      img=card.find('img')
                      if not price or not img:continue
                      src=img.get('data-src') or img.get('src') or img.get('data-original') or ''
                      if not src and img.get('srcset'):src=img['srcset'].split(',')[0].strip().split(' ')[0]
                      if not src or src.startswith('data:'):continue
                      title=a.get_text(' ',strip=True) or img.get('alt','')
                      found[target]={'name':title[:100],'price_text':price.group(),'url':target,'img':urllib.parse.urljoin(url,src)}
                  print('COMPLETE CANDIDATES:',len(found))
                  for item in list(found.values())[:5]:
                      try:
                          req=urllib.request.Request(item['img'],headers={**headers,'Range':'bytes=0-1023'})
                          with urllib.request.urlopen(req,timeout=15) as r: item['image_http']=r.status;item['image_type']=r.headers.get('Content-Type','')
                      except Exception as e:item['image_error']=str(e)[:100]
                      print('ITEM',json.dumps(item,ensure_ascii=False))
                  if not found:print('NEEDS CUSTOM PARSER: no complete cards extracted')
              except Exception as e:print('ERROR',type(e).__name__,str(e)[:180])
          PY
