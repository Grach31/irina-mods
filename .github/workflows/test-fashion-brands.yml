name: Test new fashion brands (diagnostic only)
on:
  push:
    paths:
      - '.github/workflows/test-fashion-brands.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public catalogs and product metadata
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, re, html
          sites = {
              'STUDIO 29': 'https://studio-29.ru/catalog',
              'GATE31': 'https://www.gate31.ru/collection/woman',
              'Present & Simple': 'https://presentandsimple.com/',
              'ALL WE NEED': 'https://allweneed.ru/catalog',
              'CHARUEL': 'https://www.charuel.ru/',
          }
          for brand, url in sites.items():
              print('\nBRAND:', brand, 'URL:', url, flush=True)
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36','Accept-Language':'ru-RU,ru;q=0.9'})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body = r.read(2500000).decode('utf-8', 'replace')
                      print('HTTP:', r.status, 'Final:', r.url, 'Chars:', len(body))
                  print('Anti-bot markers:', [x for x in ('servicepipe','captcha','cloudflare','access denied') if x in body.lower()])
                  print('Price markers:', len(re.findall(r'(?:₽|&#8381;|руб\\.?|RUB)',body,re.I)))
                  print('Images:', len(re.findall(r'<(?:img|source)\\b',body,re.I)))
                  print('Links:', len(re.findall(r'<a\\b[^>]*href=',body,re.I)))
                  print('Product schema:', 'schema.org/Product' in body or '"@type":"Product"' in body)
                  title = re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)
                  print('Title:', html.unescape(re.sub(r'\\s+',' ',title.group(1)))[:120] if title else 'not found')
                  print('VERDICT:', 'REQUIRES PARSER TEST' if len(re.findall(r'(?:₽|&#8381;|руб\\.?|RUB)',body,re.I))>2 and len(re.findall(r'<(?:img|source)\\b',body,re.I))>2 else 'NO USABLE HTML CONFIRMED')
              except Exception as e:
                  print('ERROR:',type(e).__name__,str(e)[:180])
          PY
