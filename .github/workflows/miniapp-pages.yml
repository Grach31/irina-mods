name: Stambo Mini App
on:
  push:
    branches: [main]
    paths:
      - AGENT.md
      - miniapp/**
      - drafts/**
      - state/state.json
      - scripts/build_miniapp_catalog.py
      - scripts/build_notification_manifest.py
      - scripts/render_draft_jpg.py
      - scripts/media_contract.py
      - supabase/**
      - tests/**
      - editorial/**
      - .github/workflows/miniapp-pages.yml
  workflow_dispatch:
  pull_request:
    paths:
      - drafts/**
      - state/state.json
      - AGENT.md
      - miniapp/**
      - scripts/build_miniapp_catalog.py
      - scripts/build_notification_manifest.py
      - scripts/render_draft_jpg.py
      - scripts/media_contract.py
      - supabase/**
      - tests/**
      - editorial/**
      - .github/workflows/miniapp-pages.yml
permissions:
  contents: read
concurrency:
  group: stambo-miniapp-pages
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test image tooling
        run: python -m pip install --quiet Pillow==11.3.0
      - name: Test data contracts and My Space
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test JavaScript behavior
        run: |
          node --test tests/*.test.mjs
          node --check miniapp/notifications.js
          node --check miniapp/sw.js
          node --check miniapp/gestures.js
          node --check miniapp/editorial-publish.js
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('miniapp/index.html').read_text()
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',html,re.S)
          inline=[s for s in scripts if s.strip()]
          assert len(inline)==1, len(inline)
          Path('/tmp/stambo-miniapp.js').write_text(inline[0])
          PY
          node --check /tmp/stambo-miniapp.js
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: drafts/img
          key: jpg-v2-${{ hashFiles('drafts/*.json', 'scripts/render_draft_jpg.py', 'scripts/media_contract.py') }}
          restore-keys: jpg-v2-
      - name: Build current verified media
        run: |
          python -m pip install --quiet Pillow==11.3.0
          python scripts/render_draft_jpg.py --pending --keep-going
      - name: Build current publications catalog
        run: |
          python scripts/build_miniapp_catalog.py
          python scripts/build_notification_manifest.py
      - name: Audit Moda draft delivery readiness
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          day = datetime.now(ZoneInfo('Europe/Moscow')).date().isoformat()
          catalog = json.loads(Path('miniapp/catalog.json').read_text(encoding='utf-8'))
          rows = [item for item in catalog['items'] if item.get('type') == 'picks' and item['id'].startswith(day + '-')]
          passed = [item['id'] for item in rows if item.get('ready') is True]
          failed = [item['id'] for item in rows if item.get('ready') is not True]
          summary = f"## Moda media delivery — {day}\nReady: {len(passed)} / {len(rows)}\n\n"
          summary += ''.join(f"- {'READY' if item['id'] in passed else 'MISSING JPG'}: {item['id']}\n" for item in rows)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as file:
                  file.write(summary)
          if failed:
              print("::warning title=Moda images missing::Drafts without verified JPG: " + ", ".join(failed))
          print("MODA_MEDIA_AUDIT " + json.dumps({'date': day, 'ready': passed, 'missing': failed}, ensure_ascii=False))
          PY
      - name: Generate iPhone home screen icons
        run: |
          python -m pip install --quiet CairoSVG==2.7.1
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          icon=Path('miniapp/icon.svg').read_bytes()
          for size in (180,192,512):
              cairosvg.svg2png(bytestring=icon,write_to=f'miniapp/icon-{size}.png',output_width=size,output_height=size)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: miniapp
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify My Space of deployed release
        if: success()
        continue-on-error: true
        env:
          NOTICE_URL: https://rjnfokknhjmtuzturvub.supabase.co/functions/v1/myspace-notifications
          NOTICE_SHA: ${{ github.sha }}
        run: |
          python - <<'PYCODE'
          import json, os, urllib.request
          token_url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience=myspace-notifications'
          req=urllib.request.Request(token_url,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token=json.load(urllib.request.urlopen(req,timeout=20))['value']
          req=urllib.request.Request(os.environ['NOTICE_URL'],data=b'{"action":"deployment"}',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=50) as response:
              print('Notification reconciliation:',response.status)
              result=json.load(response)
          if result.get('ok') is not True or result.get('disabled') or not isinstance(result.get('ingested'),dict):
              raise RuntimeError('My Space did not confirm release reconciliation')
          print('MYSPACE_DEPLOYMENT_RECONCILED '+json.dumps({'sha':os.environ['NOTICE_SHA'],'ingested':result['ingested']}))
          PYCODE
  notify_failure:
    if: always() && github.event_name != 'pull_request' && (needs.checks.result == 'failure' || needs.build.result == 'failure' || needs.deploy.result == 'failure')
    needs: [checks, build, deploy]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment failure
        continue-on-error: true
        env:
          NOTICE_SHA: ${{ github.sha }}
        run: |
          python - <<'PYCODE'
          import json, os, urllib.request
          req=urllib.request.Request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience=myspace-notifications',headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token=json.load(urllib.request.urlopen(req,timeout=20))['value']
          req=urllib.request.Request('https://rjnfokknhjmtuzturvub.supabase.co/functions/v1/myspace-notifications',data=json.dumps({'action':'deployment_error','sha':os.environ['NOTICE_SHA']}).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as response:
              print('Failure recorded:',response.status)
          PYCODE
