name: Stambo Mini App
on:
  push:
    branches: [main]
    paths:
      - miniapp/**
      - drafts/**
      - state/state.json
      - scripts/build_miniapp_catalog.py
      - scripts/build_notification_manifest.py
      - scripts/render_draft_jpg.py
      - scripts/media_contract.py
      - supabase/**
      - tests/**
      - editorial/**
      - tests/test_myspace_ui.py
      - tests/test_miniapp.py
      - .github/workflows/miniapp-pages.yml
  workflow_dispatch:
  pull_request:
    paths:
      - miniapp/**
      - scripts/build_miniapp_catalog.py
      - scripts/build_notification_manifest.py
      - scripts/render_draft_jpg.py
      - scripts/media_contract.py
      - supabase/**
      - tests/**
      - editorial/**
      - tests/test_miniapp.py
      - .github/workflows/miniapp-pages.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: stambo-miniapp-pages
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test image tooling
        run: python -m pip install --quiet Pillow==11.3.0
      - name: Test My Space six-section release
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test notifications
        run: |
          python -m unittest discover -s tests -p test_notifications.py -v
          node --test tests/*.test.mjs
          node --check miniapp/notifications.js
          node --check miniapp/sw.js
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('miniapp/index.html').read_text()
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',html,re.S)
          inline=[s for s in scripts if s.strip()]
          assert len(inline)==1, len(inline)
          Path('/tmp/stambo-miniapp.js').write_text(inline[0])
          PY
          node --check /tmp/stambo-miniapp.js
  deploy:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: drafts/img
          key: jpg-v2-${{ hashFiles('drafts/*.json', 'scripts/render_draft_jpg.py', 'scripts/media_contract.py') }}
          restore-keys: jpg-v2-
      - name: Build current verified media
        run: |
          python -m pip install --quiet Pillow==11.3.0
          python scripts/render_draft_jpg.py --pending --keep-going
      - name: Build current publications catalog
        run: |
          python scripts/build_miniapp_catalog.py
          python scripts/build_notification_manifest.py
      - name: Generate iPhone home screen icons
        run: |
          python -m pip install --quiet CairoSVG==2.7.1
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          icon=Path('miniapp/icon.svg').read_bytes()
          for size in (180,192,512):
              cairosvg.svg2png(bytestring=icon,write_to=f'miniapp/icon-{size}.png',output_width=size,output_height=size)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: miniapp
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify My Space of deployed release
        if: success()
        continue-on-error: true
        env:
          NOTICE_URL: https://rjnfokknhjmtuzturvub.supabase.co/functions/v1/myspace-notifications
        run: |
          python - <<'PYCODE'
          import json, os, urllib.request
          token_url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience=myspace-notifications'
          req=urllib.request.Request(token_url,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token=json.load(urllib.request.urlopen(req,timeout=20))['value']
          req=urllib.request.Request(os.environ['NOTICE_URL'],data=b'{"action":"deployment"}',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=50) as response:
              print('Notification reconciliation:',response.status)
          PYCODE
  notify_failure:
    if: always() && github.event_name != 'pull_request' && (needs.checks.result == 'failure' || needs.deploy.result == 'failure')
    needs: [checks, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment failure
        continue-on-error: true
        env:
          NOTICE_SHA: ${{ github.sha }}
        run: |
          python - <<'PYCODE'
          import json, os, urllib.request
          req=urllib.request.Request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience=myspace-notifications',headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token=json.load(urllib.request.urlopen(req,timeout=20))['value']
          req=urllib.request.Request('https://rjnfokknhjmtuzturvub.supabase.co/functions/v1/myspace-notifications',data=json.dumps({'action':'deployment_error','sha':os.environ['NOTICE_SHA']}).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as response:
              print('Failure recorded:',response.status)
          PYCODE
