name: Test 12 Storeez catalog (diagnostic only)
on:
  push:
    paths:
      - '.github/workflows/test-12storeez.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe catalog without modifying data
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, re
          urls = [
              'https://12storeez.com/catalog/new/womencollection',
              'https://12storeez.com/',
          ]
          for url in urls:
              print('URL:', url, flush=True)
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36',
                  'Accept-Language': 'ru-RU,ru;q=0.9',
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read(1000000).decode('utf-8', errors='replace')
                      print('HTTP:', r.status, 'Final URL:', r.url, 'HTML chars:', len(body))
                      print('Servicepipe:', 'servicepipe' in body.lower())
                      print('Product-like links:', len(re.findall(r'href=["\\\'][^"\\\']*(?:product|catalog)[^"\\\']*', body, re.I)))
                      print('Ruble signs:', body.count('₽'))
                      print('Title:', (re.search(r'<title[^>]*>(.*?)</title>', body, re.I|re.S) or [None, 'not found'])[1][:160])
              except urllib.error.HTTPError as e:
                  print('HTTP ERROR:', e.code, e.reason)
              except Exception as e:
                  print('REQUEST ERROR:', type(e).__name__, str(e)[:250])
          PY
