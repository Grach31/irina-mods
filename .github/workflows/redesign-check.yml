name: Redesign browser checks
on:
  push:
    branches: [redesign/my-space-editorial]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: github.ref == 'refs/heads/redesign/my-space-editorial'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 CairoSVG==2.8.2
      - run: python -m unittest discover -s tests
      - run: node --test tests/*.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.65.1 happy-dom@21.0.4
      - name: Test existing My Space interfaces
        run: |
          python scripts/build_miniapp_catalog.py
          node tests/notifications-dom.cjs
          node tests/refresh-dom.cjs
          node tests/editorial-publish-dom.cjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Generate local PWA icons
        run: |
          python - <<'PY'
          from pathlib import Path
          from cairosvg import svg2png
          icon = Path('miniapp/icon.svg').read_bytes()
          for size in (180, 192, 512):
              svg2png(bytestring=icon, write_to=f'miniapp/icon-{size}.png', output_width=size, output_height=size)
          PY
      - run: node tests/redesign-smoke.cjs
        env:
          REDESIGN_QA_DIR: qa-screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-space-mobile-screens
          path: qa-screens/
          if-no-files-found: ignore
